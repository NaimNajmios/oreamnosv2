name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build check (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # Dart's analyzer cannot see Kotlin/Java. A debug APK compiles every
      # native widget receiver, the update installer channel and MainActivity
      # without needing a signing key.
      - name: Build debug APK (native Kotlin check)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oreamnos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
