name: oreamnos
description: "AI Assisted Social Media Curator — Transform football news into Malaysian Malay social media posts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management & DI
  provider: ^6.1.4

  # Routing
  go_router: ^14.8.1

  # Networking
  http: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Typography
  google_fonts: ^6.2.1

  # JSON Serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Markdown Rendering
  flutter_markdown: ^0.7.7
  dynamic_color: 1.7.0
  receive_sharing_intent: 1.8.1
  html: ^0.15.6
  share_plus: ^12.0.2
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  gal: ^2.3.3
  path_provider: ^2.1.6
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  quick_settings: ^1.0.1
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon/icon.png"

flutter_native_splash:
  color: "#1C1C1C"
  image: "icon/icon.png"
  android: true
  ios: true
